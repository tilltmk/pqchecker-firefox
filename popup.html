<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
    }
    .header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #2a2a4a;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .status-banner {
      padding: 20px 16px;
      text-align: center;
    }
    .status-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .status-label {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .status-sub {
      font-size: 12px;
      opacity: 0.7;
    }
    .status-pq { background: linear-gradient(135deg, #0d3320, #1a4a30); }
    .status-pq .status-label { color: #4ade80; }
    .status-classical { background: linear-gradient(135deg, #3d2c08, #4a3510); }
    .status-classical .status-label { color: #fbbf24; }
    .status-insecure { background: linear-gradient(135deg, #3d0a0a, #4a1010); }
    .status-insecure .status-label { color: #f87171; }
    .status-unknown { background: linear-gradient(135deg, #1e1e3a, #2a2a4a); }
    .status-unknown .status-label { color: #94a3b8; }

    .details {
      padding: 12px 16px;
    }
    .detail-section {
      margin-bottom: 12px;
    }
    .detail-section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #ffffff08;
    }
    .detail-key {
      color: #94a3b8;
      font-size: 12px;
    }
    .detail-value {
      color: #e0e0e0;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      max-width: 200px;
      text-align: right;
      word-break: break-all;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-pq { background: #064e3b; color: #4ade80; }
    .tag-classical { background: #451a03; color: #fbbf24; }
    .tag-none { background: #1e1e3a; color: #64748b; }

    .cert-card {
      background: #ffffff08;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 6px;
    }
    .cert-card .cert-subject {
      font-size: 12px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .cert-card .cert-issuer {
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
    }

    .footer {
      padding: 10px 16px;
      text-align: center;
      border-top: 1px solid #2a2a4a;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>POST-QUANTUM CHECKER</h1>
  </div>
  <div id="content">
    <div class="status-banner status-unknown">
      <div class="status-icon">...</div>
      <div class="status-label">Lade...</div>
    </div>
  </div>
  <div class="footer">PQ Cert Checker v1.0</div>
  <script src="popup.js"></script>
</body>
</html>
